# The box's services. deploy.sh runs it with the project name grove and GROVE_BUILD_SHA set.
# Secret values live only in /etc/grove/*.env on the box (docs/deploy.md); none is in this file.
name: grove

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  neo4j:
    # Multi-arch index digest of neo4j:2026.10.1-community, the pin of docker-compose.dev.yml.
    image: neo4j:2026.10.1-community@sha256:44ad2a2504fd7d27df1d1e976f2d481e4266a0814d3657f2d5df62124ce657f1
    restart: unless-stopped
    env_file:
      - /etc/grove/neo4j.env
    environment:
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_query_default__language: CYPHER_25
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks: [store]
    # A clean shutdown before the nightly dump; no port leaves the store network.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: grove-api:${GROVE_BUILD_SHA:?deploy.sh sets GROVE_BUILD_SHA}
    restart: unless-stopped
    init: true
    env_file:
      - /etc/grove/api.env
      - /etc/grove/neo4j.env
      - path: /etc/grove/model-api.env
        required: false
      - path: /etc/grove/modal.env
        required: false
      - path: /etc/grove/resend.env
        required: false
      # The API mints the gateway run token and the pass token of each pass. With no gateway
      # secret or no runner token hash, the runner routes answer 503.
      - path: /etc/grove/gateway.env
        required: false
      - path: /etc/grove/runner-auth.env
        required: false
      - path: /etc/grove/glimmer.env
        required: false
    environment:
      GROVE_ENV: production
      GROVE_NEO4J_URI: bolt://neo4j:7687
      GROVE_BUILD_SHA: ${GROVE_BUILD_SHA}
      GROVE_GOOGLE_OAUTH_FILE: /run/grove/google-oauth.json
      # Screening reads both files at each upload. While one is absent, uploads answer 503 and
      # every other path serves (docs/deploy.md, uploads and the screening files).
      GROVE_RENAME_MAP: /run/grove/screening/rename.json
      GROVE_DENYLIST: /run/grove/screening/denylist.txt
      # The API's own default, written out so nginx's limit for the upload path can match it.
      GROVE_UPLOAD_MAX_BYTES: "268435456"
    volumes:
      - type: bind
        source: /etc/grove/google-oauth.json
        target: /run/grove/google-oauth.json
        read_only: true
        bind:
          create_host_path: false
      # The folder, not the two files: a file mount needs the file, and a deploy must work while
      # the files are absent. apply.sh makes the folder, so docker never makes one as root.
      - type: bind
        source: /etc/grove/screening
        target: /run/grove/screening
        read_only: true
        bind:
          create_host_path: false
    # nginx on the host is the only way in.
    ports:
      - "127.0.0.1:8000:8000"
    networks: [store, runner, egress]
    read_only: true
    # An upload past 8 MiB spools to /tmp, one at a time, up to 256 MiB. The size holds it, and
    # keeps a runaway write from taking half the box's memory, the tmpfs default.
    tmpfs: ["/tmp:size=320m"]
    # One upload at its caps holds about 2.5 GiB (grove.api.uploads). The limit, with the tmpfs in
    # it, keeps the worst case inside this container: the kernel stops the api, docker starts it
    # again, and neo4j and the box keep their memory. No swap past the limit.
    mem_limit: 4g
    memswap_limit: 4g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    logging: *logging

  gateway:
    # The model gateway (docs/models.md): the API's image, its own process. It holds the model keys
    # and GROVE_GATEWAY_SECRET, and writes each call to model_calls in the store.
    image: grove-api:${GROVE_BUILD_SHA:?deploy.sh sets GROVE_BUILD_SHA}
    command: ["python", "-m", "grove.models.gateway"]
    restart: unless-stopped
    init: true
    env_file:
      - /etc/grove/neo4j.env
      - path: /etc/grove/gateway.env
        required: false
      - path: /etc/grove/model-api.env
        required: false
      - path: /etc/grove/glimmer.env
        required: false
    environment:
      GROVE_ENV: production
      GROVE_NEO4J_URI: bolt://neo4j:7687
      # Not the default 127.0.0.1, which the runner's container cannot reach. No port is published,
      # and every call needs a run token signed with GROVE_GATEWAY_SECRET.
      GROVE_GATEWAY_HOST: 0.0.0.0
      GROVE_GATEWAY_PORT: "18300"
    networks: [store, runner, egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18300/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    logging: *logging

  runner:
    build:
      context: ..
      dockerfile: deploy/runner.Dockerfile
    image: grove-runner:${GROVE_BUILD_SHA:?deploy.sh sets GROVE_BUILD_SHA}
    restart: unless-stopped
    init: true
    user: "10002:10002"
    # A stop ends each running pass: the group gets 10 s after SIGTERM and 5 s after SIGKILL,
    # then the pass's folder (the person's words) is removed and the pass is ended. Docker's
    # default 10 s would kill the loop before that.
    stop_grace_period: 40s
    # The runner token only: no store credential and no model key reach this service.
    env_file:
      - path: /etc/grove/runner.env
        required: false
    environment:
      GROVE_ENV: production
      GROVE_API_URL: http://api:8000
      GROVE_GATEWAY_URL: http://gateway:18300/v1
      GROVE_RUNNER_CONFIG: /opt/grove/runner
      GROVE_OPENCODE_BIN: /usr/local/bin/opencode
    volumes:
      - /var/lib/grove-runner:/var/lib/grove-runner
    # The runner network is internal: the runner reaches the API and the gateway and nothing else.
    networks: [runner]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_started
      gateway:
        condition: service_started
    logging: *logging

networks:
  store:
    internal: true
  runner:
    internal: true
    driver_opts:
      # A stable interface name for a host firewall rule (at most 15 characters).
      com.docker.network.bridge.name: grove-runner
  egress: {}

volumes:
  neo4j-data:
    name: grove-neo4j-data
  neo4j-logs:
    name: grove-neo4j-logs
