[project]
name = "grove"
version = "0.1.0"
description = "Grove: a live, time-aware representation of your world, built on Meta's models"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "neo4j>=6.4,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6,<7",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grove"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a model; runs only in a lane, never in CI",
]
addopts = "-m 'not live'"
