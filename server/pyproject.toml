[project]
name = "grove"
version = "0.1.0"
description = "Grove: a live, time-aware representation of your world, built on Meta's models"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1,<9",
    "cryptography>=46,<49",
    "fastapi>=0.120",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.25",
    "neo4j>=6.4,<7",
    "uvicorn>=0.38",
    "zstandard>=0.23,<0.26",
]

[project.scripts]
brain = "grove.cli.main:main"
grove-brain-shell = "grove.runner.shell:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "pyyaml>=6,<7",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grove"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a model or the mail provider; runs only in a lane, never in CI",
    "browser: drives a real browser with Playwright; runs only in a lane, never in CI",
    "opencode: runs the pinned OpenCode binary against a scripted local model; no model is called",
]
addopts = "-m 'not live and not browser'"
